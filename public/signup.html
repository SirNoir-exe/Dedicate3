<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <meta name="theme-color" content="#0e1038">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap auth-wrap">
    <div class="card auth-card">
      <h1 class="page-title">Sign up</h1>
      <p class="muted">Make an account with your school email to send dedications.</p>

      <form class="form" id="signup-form" novalidate>
        <div class="form-error" id="error" role="alert"></div>
        <div class="field">
          <label for="fullName">Full name</label>
          <input class="input" id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <label for="email">School email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="className">Class <span class="hint">(optional, like SS2A)</span></label>
          <input class="input" id="className" name="className" type="text" maxlength="30">
        </div>
        <div class="row-2">
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <span class="hint">At least 8 characters.</span>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required>
          </div>
        </div>
        <button class="btn btn-block" type="submit" id="submit">Create account</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
