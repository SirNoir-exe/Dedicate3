<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff panel</title>
  <meta name="theme-color" content="#0e1038">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h1 class="page-title">Staff panel</h1>
        <p class="lede" style="margin-top:10px">Mark each dedication as played, belated or cancelled.</p>
      </div>
      <span class="live" id="live">Updating every 30 seconds</span>
    </div>

    <div class="stats" id="stats" role="group" aria-label="Filter by status">
      <button class="stat pending" type="button" data-status="pending" aria-pressed="true"><strong>0</strong><span>Pending</span></button>
      <button class="stat played" type="button" data-status="played" aria-pressed="false"><strong>0</strong><span>Played</span></button>
      <button class="stat belated" type="button" data-status="belated" aria-pressed="false"><strong>0</strong><span>Belated</span></button>
      <button class="stat cancelled" type="button" data-status="cancelled" aria-pressed="false"><strong>0</strong><span>Cancelled</span></button>
    </div>

    <div class="chips" id="date-chips" role="group" aria-label="Filter by date">
      <button class="chip" type="button" data-range="today" aria-pressed="true">Today</button>
      <button class="chip" type="button" data-range="tomorrow" aria-pressed="false">Tomorrow</button>
      <button class="chip" type="button" data-range="upcoming" aria-pressed="false">Next 7 days</button>
      <button class="chip" type="button" data-range="overdue" aria-pressed="false">Past dates</button>
      <button class="chip" type="button" data-range="all" aria-pressed="false">All dates</button>
    </div>

    <div class="filters">
      <div class="field">
        <label for="q">Search</label>
        <input class="input" id="q" type="search" placeholder="Name, song or artist" autocomplete="off">
      </div>
      <div class="field">
        <label for="date">Pick a date</label>
        <input class="input" id="date" type="date">
      </div>
      <button class="btn btn-ghost" type="button" id="reset">Reset</button>
    </div>

    <div class="list" id="list" aria-live="polite"></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
