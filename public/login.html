<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <meta name="theme-color" content="#0e1038">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap auth-wrap">
    <div class="card auth-card">
      <h1 class="page-title">Log in</h1>
      <p class="muted">Use the school email you signed up with.</p>

      <form class="form" id="login-form" novalidate>
        <div class="form-error" id="error" role="alert"></div>
        <div class="field">
          <label for="email">School email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit" id="submit">Log in</button>
      </form>

      <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
